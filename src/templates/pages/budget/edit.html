<div class="budget ps-3 pe-3 pt-3 ps-xl-0 pe-xl-0 pt-xl-0">

  <h1 class="text-primary-emphasis title-page mb-4 mb-xl-5 ms-5 ms-xl-0 ps-4 ps-xl-0">Редактирование дохода/расхода</h1>

  <div class="budget-form row-gap-2 d-flex flex-column">
    <select class="form-select focus-ring focus-ring-primary" id="typeSelect" style="max-width: 397px" required>
      <option value="income" id="type-income">доход</option>
      <option value="expense" id="type-expense">расход</option>
    </select>
    <select class="form-select focus-ring focus-ring-primary" id="categorySelect" style="max-width: 397px" required>
      <option>не выбрано</option>
    </select>
    <input type="number" class="border rounded-1 focus-ring focus-ring-primary py-1 px-2" id="amount" placeholder="Сумма в $..." style="max-width: 397px">
    <input type="date" class="border rounded-1 focus-ring focus-ring-primary py-1 px-2" id="date" placeholder="Дата..." style="max-width: 397px">
    <input type="text" class="border rounded-1 focus-ring focus-ring-primary py-1 px-2" id="comment" placeholder="Комментарий..." style="max-width: 397px">
    <div class="buttons mt-4">
      <a href="javascript:void(0)" class="btn btn-success title-page me-1" id="save">Сохранить</a>
      <a href="/budget" class="btn btn-danger title-page">Отмена</a>
    </div>
  </div>

</div>
